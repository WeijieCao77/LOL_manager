<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121c27" />
    <!-- The ground the page is drawn on, read before anything paints so a
         light page never flashes dark on its way in. Same key ui/theme.ts
         owns; this is only the first read. -->
    <script>
      try {
        var t = localStorage.getItem('valmgr.theme');
        if (t === 'light' || t === 'cream') {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'light' ? '#e6eaf0' : '#e9e1d0');
        }
      } catch (e) {}
    </script>
    <title>英雄联盟电竞经理 · LOL MANAGER</title>
    <meta name="description" content="一款免费的英雄联盟电竞经理浏览器游戏：接手一支真实战队，BP、训练、转会、谈赞助，从联赛打到全球总决赛。每一位选手都是真人，能力来自真实比赛数据。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
